# Example Docker healthcheck + restart policy.
# `restart` handles a crashed container; `healthcheck` is what an external
# monitor or an autoheal sidecar can use. Neither replaces an alert.

services:
  app:
    image: <your-image>:<version>
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
