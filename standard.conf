# AI Dev Standard — repo configuration
# This file configures scripts/preflight.sh for the standard repo itself.

PROJECT_NAME="AI Dev Standard"
DEFAULT_BRANCH="main"

# The standard is a versioned document/library: SemVer fits.
VERSION_SCHEME="semver"
VERSION_FILE="VERSION"
RELEASE_NOTE_DIR="docs/releases"
TAG_PREFIX="v"

BRANCH_PREFIXES="feat fix docs chore refactor test perf build ci"
BRANCH_MAX_AGE_DAYS=14

REQUIRE_PR=1
REQUIRE_CLEAN_TREE=1
REQUIRE_TAG=1

MAX_FILE_MB=5
ALLOW_TRACKED_DIST=0
SECRET_SCAN=1

DOCS_VERSIONING=1
CHANGELOG=1
MODULES=""
TIMEZONE="Asia/Shanghai"
