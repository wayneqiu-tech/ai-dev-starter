# Standard preset — the recommended default for web/AI apps and solo developers.
# Copy to docs/standards/standard.conf and edit PROJECT_NAME.

PROJECT_NAME="my-project"
DEFAULT_BRANCH="main"

# Dated versions: R20261106.01
# Use "semver" for libraries/CLIs/app-store apps (and set TAG_PREFIX="v").
VERSION_SCHEME="dated"
VERSION_FILE="VERSION"
RELEASE_NOTE_DIR="docs/releases"
TAG_PREFIX=""

BRANCH_PREFIXES="feat fix docs chore refactor test"
BRANCH_MAX_AGE_DAYS=7

# A PR is optional when solo, but the checklist is not.
REQUIRE_PR=0
REQUIRE_CLEAN_TREE=1
REQUIRE_TAG=1

MAX_FILE_MB=5
ALLOW_TRACKED_DIST=0
SECRET_SCAN=1

# Prefer a release number for docs changes too (cheap, keeps the record).
DOCS_VERSIONING=1
CHANGELOG=0
MODULES=""
TIMEZONE="Asia/Shanghai"
