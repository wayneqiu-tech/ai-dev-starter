# Strict preset — for open-source libraries, paid products, and teams.
# Copy to docs/standards/standard.conf and edit PROJECT_NAME.
# This preset assumes you have CI, branch protection, and at least one reviewer.

PROJECT_NAME="my-project"
DEFAULT_BRANCH="main"

# SemVer for libraries/CLIs; switch to "dated" for a service.
VERSION_SCHEME="semver"
VERSION_FILE="VERSION"
RELEASE_NOTE_DIR="docs/releases"
TAG_PREFIX="v"

BRANCH_PREFIXES="feat fix docs chore refactor test perf build ci"
BRANCH_MAX_AGE_DAYS=7

REQUIRE_PR=1
REQUIRE_CLEAN_TREE=1
REQUIRE_TAG=1

MAX_FILE_MB=5
ALLOW_TRACKED_DIST=0
SECRET_SCAN=1

DOCS_VERSIONING=1
CHANGELOG=1
MODULES=""
TIMEZONE="Asia/Shanghai"
