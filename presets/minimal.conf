# Minimal preset — for scripts, prototypes, and tiny tools.
# Copy to docs/standards/standard.conf and edit PROJECT_NAME.
# The goal is a floor, not a full process.

PROJECT_NAME="my-project"
DEFAULT_BRANCH="main"

# Dated versions keep it simple: R20261106.01
VERSION_SCHEME="dated"
VERSION_FILE="VERSION"
RELEASE_NOTE_DIR="docs/releases"
TAG_PREFIX=""

# Few branch types; keep branches short.
BRANCH_PREFIXES="fix docs chore"
BRANCH_MAX_AGE_DAYS=14

# Solo work: no PR requirement, but keep a clean tree before release.
REQUIRE_PR=0
REQUIRE_CLEAN_TREE=1
REQUIRE_TAG=1

# Be forgiving about large files in a prototype.
MAX_FILE_MB=10

# Still important.
ALLOW_TRACKED_DIST=0
SECRET_SCAN=1

# Docs changes do not need their own release.
DOCS_VERSIONING=0
CHANGELOG=0
MODULES=""
TIMEZONE="Asia/Shanghai"
